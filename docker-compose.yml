# Local development environment
# Starts PostgreSQL and Redis only — run the app with ./gradlew bootRun
#
# Usage:
#   docker compose up -d
#   docker compose down
#   docker compose down -v   # also wipes volumes

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coupon_db
      POSTGRES_USER: coupon
      POSTGRES_PASSWORD: coupon_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupon -d coupon_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
