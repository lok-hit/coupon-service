name: Deploy

on:
  push:
    branches: [main]

# Only one deploy at a time — prevent race conditions on the VM
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Build JAR + Docker image, push to ghcr.io
  # ─────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # Tests already ran in CI — skip here to avoid double billing.
      # If you prefer to re-run tests before every deploy, remove -x test.
      - name: Build JAR
        run: ./gradlew bootJar --no-daemon -x test

      # Multi-platform build: linux/amd64 (x86 VM) + linux/arm64 (Ampere A1)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
