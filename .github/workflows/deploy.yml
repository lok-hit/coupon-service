name: Deploy

on:
  push:
    branches: [main]

# Only one deploy at a time — prevent race conditions on the VM
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Build JAR + Docker image, push to ghcr.io
  # ─────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # Tests already ran in CI — skip here to avoid double billing.
      # If you prefer to re-run tests before every deploy, remove -x test.
      - name: Build JAR
        run: ./gradlew bootJar --no-daemon -x test

      # Multi-platform build: linux/amd64 (x86 VM) + linux/arm64 (Ampere A1)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache — dramatically speeds up repeated builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────
  # Job 2: SSH to Oracle Cloud VM and deploy
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest

    # "production" environment in GitHub settings enables manual approval gate
    # and protects secrets. Configure it at:
    # Settings → Environments → production
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          # Fail immediately if any command fails
          script_stop: true
          script: |
            set -euo pipefail

            cd /opt/coupon-service

            # Authenticate to ghcr.io on the VM
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the new image tag
            IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }} \
            GITHUB_REPOSITORY=${{ github.repository }} \
              docker compose -f docker-compose.prod.yml pull app

            # Rolling restart: bring up new container, remove old one
            IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }} \
            GITHUB_REPOSITORY=${{ github.repository }} \
              docker compose -f docker-compose.prod.yml up -d --no-build

            # Clean up dangling images to keep disk usage in check
            docker image prune -f

            echo "Deployed image tag: ${{ needs.build-and-push.outputs.image-tag }}"

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            # Wait up to 60s for the app to respond
            for i in $(seq 1 12); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed (attempt $i)"
                exit 0
              fi
              echo "Attempt $i: HTTP $STATUS — waiting 5s..."
              sleep 5
            done
            echo "Health check failed after 60s" && exit 1
