# Nginx reverse proxy for Jenkins on Oracle Cloud Free Tier
# Replace YOUR_DOMAIN with your actual domain (e.g. ci.example.com)
#
# After certbot issues a certificate, it will modify this file automatically.
# If you manage certs manually, update the ssl_certificate paths.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Let certbot handle ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # TLS — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # Jenkins proxy settings
    # Required for Jenkins to generate correct redirect URLs
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Increase timeouts for long-running builds
    proxy_connect_timeout       150s;
    proxy_read_timeout          300s;
    proxy_send_timeout          300s;

    # Required for Jenkins WebSocket (used by Blue Ocean and agent connections)
    proxy_http_version 1.1;
    proxy_request_buffering off;

    location / {
        proxy_pass http://jenkins:8080;
    }
}
